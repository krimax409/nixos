# Manifest for the kimi-code API keys pulled from Infisical on the fly.
# Backend: machine identity "nixos-hosts" (Universal Auth) -> project
# "nixos-configs", environment "Development" (slug: dev).
# Fetched by systemd user service kimi-secrets.service (modules/home/kimi-secrets.nix)
# into ~/.cache/kimi-code/env, sourced by zsh and the greetd session wrapper.
[project]
name = "nixos-configs"
revision = "1.0"

[providers.infisical]
ref = { item = "/{key}" }
uri = "infisical://app.infisical.com/9984de51-f276-4ede-ba2e-343a38db882e?env=dev"

[profiles.default.defaults]
providers = ["infisical"]

[profiles.default]
A6_API_KEY = { description = "a6api.com key for kimi-code provider" }
MODELHUB_API_KEY = { description = "modelhub.my key for kimi-code provider" }
NH_API_KEY = { description = "normahub.cc key for kimi-code provider" }
TWENTYFIRST_API_KEY = { description = "21st.dev MCP bearer token (exported as KIMI_21ST_API_KEY)" }
