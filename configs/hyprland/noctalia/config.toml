[shell]
avatar_path = "~/Pictures/noctalia-avatar.png"
lang = "ru"
telemetry_enabled = false
polkit_agent = true
show_location = false
font_family = "Noto Sans"
corner_radius_scale = 0.8
input_borders = true
panel_anchor_bar = "main"
popup_borders = true
popup_shadows = true

[shell.panel]
transparency_mode = "solid"
borders = true
shadow = true

[shell.keyboard_layout.custom_labels]
"English (US)" = "EN"
"Russian" = "RU"

[wallpaper]
enabled = true
fill_color = "#181818"

[wallpaper.default]
path = "color:#181818"

[theme]
mode = "dark"
source = "custom"
custom_palette = "windows-neutral"

[lockscreen]
enabled = true

[weather]
enabled = false

[location]
auto_locate = false

[bar.main]
position = "bottom"
thickness = 40
scale = 1.0
auto_hide = false
reserve_space = true
layer = "top"
background_opacity = 0.98
margin_ends = 0
margin_edge = 0
radius = 0
padding = 12
widget_spacing = 8
shadow = false
start = [ "workspaces" ]
center = [ "launcher", "taskbar" ]
end = [ "tray", "notifications", "keyboard_layout", "battery", "clock", "control-center" ]

[dock]
enabled = false

[widget.launcher]
type = "launcher"
glyph = "brand-windows-filled"

[widget.launcher.actions]
left = "exec qs ipc -n -c win11-start-menu call start-menu toggle"

[widget.workspaces]
type = "workspaces"
capsule = false
show_labels = true
label_source = "id"
style = "regular"
pill_scale = 0.84
active_pill_size = 1.6
focused_color = "primary"
occupied_color = "surface_variant"
empty_color = "#292929"
change_color_on_hover = false

[widget.taskbar]
type = "taskbar"
pinned = []
show_active_indicator = true
show_window_title = false

[widget.tray]
type = "tray"
drawer = true

[widget.keyboard_layout]
type = "keyboard_layout"
show_glyph = false
show_label = true

[widget.control-center]
type = "control-center"
glyph = "adjustments-horizontal"

[widget.battery]
type = "battery"
show_label = true

[widget.clock]
type = "clock"
format = "{:%H:%M}"
