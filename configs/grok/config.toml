[marketplace]
default_skills_installs_purged = true

[skills]
# Grok expands ~ in skill paths and runs auth commands through POSIX sh.
paths = ["~/.codex/skills/karpathy-guidelines"]
ignore = []
disabled = []
server_skill_dirs = []
bundled_skill_dirs = []

[models]
default = "a6api-gpt-5.6-sol"
default_reasoning_effort = "max"

[auth_provider.codexru]
command = "$HOME/.local/bin/grok-codexru-token"
token_ttl_secs = 3600

[auth_provider.a6api]
command = "$HOME/.local/bin/grok-a6api-token"
token_ttl_secs = 3600

[model_providers.codexru]
base_url = "https://codexru.com/ai/v1"
auth_provider = "codexru"
api_backend = "chat_completions"
context_window = 200000

[model_providers.a6api]
base_url = "https://api.a6api.com/v1"
auth_provider = "a6api"
api_backend = "chat_completions"
context_window = 200000

[model."codexru-gpt-5.5"]
model = "gpt-5.5"
model_provider = "codexru"
name = "GPT-5.5 (CodexRU)"

[model."codexru-gpt-5.6-luna"]
model = "gpt-5.6-luna"
model_provider = "codexru"
name = "GPT-5.6 Luna (CodexRU)"
context_window = 353000

